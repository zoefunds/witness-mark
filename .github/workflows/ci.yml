name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install genvm-linter
      - run: genvm-lint check contracts/witnessmark_contract.py --json

  # Deploys a fresh contract instance to StudioNet per test and runs the
  # fast, deterministic subset for real. StudioNet is gasless, so this
  # needs no funded/secret account -- gltest generates ephemeral test
  # accounts itself. Verified locally: 17/17 passing, ~14 minutes real
  # time. `timeout-minutes` bounds a hung/slow network run rather than
  # blocking the workflow indefinitely. The `slow` subset (real
  # nondeterministic adjudication, real 5-minute timeout sleep) is
  # deliberately NOT run in routine CI -- run it manually
  # (`gltest tests/integration/test_witnessmark_lifecycle.py -v -m slow`)
  # or on a schedule instead.
  contract-integration:
    runs-on: ubuntu-latest
    needs: contract-lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install genlayer-test
      - run: gltest tests/integration/test_witnessmark_lifecycle.py -v -m "not slow"

  # Proves the deployed contract actually IS this repo's source, not just
  # "a" WitnessMark contract at some address. Reads the live contract's
  # exact source and method schema directly from the chain and diffs
  # them against contracts/witnessmark_contract.py. A FAIL here means
  # real, currently-known drift between source and the deployed instance
  # (see docs/deployment-manifest.md for exactly what and why) -- it is
  # the check correctly doing its job, not a broken pipeline, and stays
  # red until the project owner redeploys. continue-on-error keeps this
  # from blocking other jobs while that's true; remove it once a redeploy
  # closes the gap and this job is expected to pass again.
  deployment-verification:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: node scripts/verify-deployment.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run test

  # Real Postgres + Redis (GitHub Actions native services, not mocks) --
  # exercises actual SQL, actual TTL/expiry, actual signature verification
  # against real DB-persisted nonces, and the evidence-upload/promise-sync
  # authorization fixes against real rows. Only the chain read (genlayer.js)
  # and Cloudinary itself stay mocked -- see each test file's header
  # comment for why (StudioNet rate limits, and not uploading real files
  # to a paid external service on every push).
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: witnessmark_test
        ports:
          - 5546:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6391:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run test:integration
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_REOWN_PROJECT_ID: "ci-placeholder"
          NEXT_PUBLIC_API_URL: "https://witnessmark-api.fly.dev"
          NEXT_PUBLIC_GENLAYER_CHAIN_ID: "61999"
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"

  # Real browser E2E tests against the LIVE deployed app (Chromium +
  # WebKit, i.e. real mobile Safari engine) -- page health, navigation,
  # the mobile hamburger menu, and the wallet-connect modal. Does not
  # cover signed on-chain transactions (see e2e/navigation.spec.ts's own
  # header comment for exactly why and what would be needed); that path
  # is covered live instead by the gltest suite (contract-integration job
  # above) against the contract directly.
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
